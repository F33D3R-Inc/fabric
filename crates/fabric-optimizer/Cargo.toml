[package]
name = "fabric-optimizer"
version = "0.1.0"
edition = "2024"

[dependencies]
fabric-core = { path = "../fabric-core" }
fabric-ml = { path = "../fabric-ml" }
fabric-topology = { path = "../fabric-topology" }
fabric-workload = { path = "../fabric-workload" }
serde = { version = "1", features = ["derive"] }
[dev-dependencies]
# Only to build a real `WorkloadProfile` in tests through
# `WorkloadProfile::from_metrics`, rather than hand-assembling one and having
# to reproduce its pressure calculation here.
fabric-telemetry = { path = "../fabric-telemetry" }
